[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tr-analytix-api"
version = "0.1.0"
description = "BIST analytics API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.6",
  "python-dotenv>=1.0",
  "sqlalchemy[asyncio]>=2.0",
  "asyncpg>=0.29",
  "redis>=5.0",
  "celery[redis]>=5.4",
  "numpy>=2.1",
  "pandas>=2.2",
  "yfinance>=1.7",
  "scipy>=1.14",
  "httpx>=0.27"
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.setuptools.packages.find]
include = ["app*"]
